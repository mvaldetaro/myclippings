# ── Nginx config for My Clippings Web (SPA) ─────────────────────────────────
# Serve arquivos estáticos do build do Vite e faz proxy reverso
# para a API em ambiente Docker.

server {
    listen 80;
    server_name _;

    # ── Root path: arquivos estáticos do Vite ──
    root /usr/share/nginx/html;

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 256;

    # ── Security headers ──
    # Cache de ativos com hash no nome (imutáveis) por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy reverso para a API ──
    # Todas as rotas com prefixo /api/ são encaminhadas para o serviço "api" na porta 3000.
    # O docker-compose define o hostname "api" via service name.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts customizados por tipo de operação:
        # Upload e importação: 120s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Permite upload de arquivos até 50MB
        client_max_body_size 50m;
    }

    # ── SPA fallback ──
    # Todas as outras rotas servem o index.html para client-side routing.
    location / {
        try_files $uri $uri/ /index.html;

        # Cache de curta duração para o HTML principal
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
